[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-iceberg-pipeline"
version = "0.1.0"
description = "Daily German day-ahead electricity prices -> Apache Iceberg -> DuckDB data quality checks, orchestrated by Airflow."
requires-python = ">=3.11,<3.12"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
